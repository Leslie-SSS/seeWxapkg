services:
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seewxapkg-backend
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      MAX_UPLOAD_SIZE: 52428800
      # The API process only accepts/persists jobs; formatting runs in worker.
      BEAUTIFY_ENABLED: "false"
      DEOBFUSCATE_ENABLED: "false"
      BEAUTIFY_TIMEOUT: 30
      BEAUTIFY_MAX_FILE_SIZE: 8388608
      TEMP_DIR: /tmp/seewxapkg
      OUTPUT_DIR: /output
      TASK_REPO_DRIVER: file
      QUEUE_DRIVER: file
      REPORT_ENABLED: "true"
      VERIFICATION_ENABLED: "true"
      NATIVE_RECOVER_ENABLED: "true"
      FALLBACK_RECOVER_ENABLED: "true"
      RETAIN_ARTIFACTS_HOURS: 24
    volumes:
      - backend-output:/output
      - backend-temp:/tmp/seewxapkg
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=0700,uid=1000,gid=1000
    ports:
      - "127.0.0.1:9090:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seewxapkg-backend-worker
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      BEAUTIFY_ENABLED: "true"
      DEOBFUSCATE_ENABLED: "false"
      BEAUTIFY_TIMEOUT: 30
      BEAUTIFY_MAX_FILE_SIZE: 8388608
      TEMP_DIR: /tmp/seewxapkg
      OUTPUT_DIR: /output
      TASK_REPO_DRIVER: file
      QUEUE_DRIVER: file
      REPORT_ENABLED: "true"
      VERIFICATION_ENABLED: "true"
      NATIVE_RECOVER_ENABLED: "true"
      FALLBACK_RECOVER_ENABLED: "true"
      # The API owns retention cleanup for the shared volumes.
      RETAIN_ARTIFACTS_HOURS: 0
      MAX_CONCURRENT_TASKS: 2
    volumes:
      - backend-output:/output
      - backend-temp:/tmp/seewxapkg
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=0700,uid=1000,gid=1000
    command: ["./worker"]
    # Package analysis is static and does not need outbound network access.
    network_mode: none

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seewxapkg-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:8080"
    depends_on:
      backend-api:
        condition: service_healthy

volumes:
  backend-output:
  backend-temp:
