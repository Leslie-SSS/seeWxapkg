limit_req_zone $binary_remote_addr zone=seewx_compile:10m rate=12r/m;

# Re-resolve container addresses after a restart instead of pinning the IP
# observed during the last Nginx reload.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream seewxapkg_frontend_upstream {
    zone seewxapkg_frontend 64k;
    server seewxapkg-frontend:8080 resolve;
    keepalive 16;
}

upstream seewxapkg_backend_upstream {
    zone seewxapkg_backend 64k;
    server seewxapkg-backend:8080 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name seewxapkg.keepbuild.cn;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name seewxapkg.keepbuild.cn;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    limit_req_status 429;
    # Task URLs act as temporary access credentials; do not persist them.
    access_log off;
    # Keep only infrastructure-critical failures. Treat this remaining log as
    # sensitive because rare Nginx failures can still include request context.
    error_log /var/log/nginx/seewxapkg-error.log crit;

    location / {
        proxy_pass http://seewxapkg_frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;

        # The TLS gateway owns public security headers; avoid duplicates from
        # the defense-in-depth headers on the internal static server.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    location = /api/compile {
        limit_req zone=seewx_compile burst=4 nodelay;
        client_max_body_size 52M;
        proxy_pass http://seewxapkg_backend_upstream/api/compile;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        client_max_body_size 52M;
        proxy_pass http://seewxapkg_backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://seewxapkg_backend_upstream/api/health;
        proxy_hide_header X-Content-Type-Options;
        access_log off;
    }
}
